# Nginx site config: one domain, two upstreams.
# /api/*  -> FastAPI (127.0.0.1:8000)
# /*      -> Flask   (127.0.0.1:5000)
# Replace helpdesk.example.com, then run: sudo certbot --nginx -d helpdesk.example.com
# (certbot adds the HTTPS server block and the HTTP->HTTPS redirect).
server {
    listen 80;
    server_name helpdesk.example.com;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
