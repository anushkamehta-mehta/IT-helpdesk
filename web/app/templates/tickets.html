{% extends "base.html" %}
{% block title %}My tickets - IT Helpdesk{% endblock %}
{% block content %}
<section id="ticket-page" data-mode="employee">
  <div class="hero">
    <div>
      <h1>Hi <span id="hero-name"></span>, need a hand from IT?</h1>
      <p id="hero-sub">Loading your tickets...</p>
    </div>
    <div class="hero-actions">
      <a class="btn btn-white" href="{{ url_for('employee.new_ticket') }}">+ New ticket</a>
    </div>
  </div>

  <section id="stats" class="stats-grid"></section>

  <section id="ticket-list" class="card table-card">
    <div class="page-head"><h2>My tickets</h2><span id="count" class="muted"></span></div>
    <form id="filters" class="filters">
      <div class="search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="search" name="q" placeholder="Search my tickets..."></div>
      <select name="status">
        <option value="">All statuses</option>
        <option>Open</option><option>Assigned</option><option>In Progress</option><option>Closed</option>
      </select>
    </form>
    <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>Title</th><th>Category</th><th>Priority</th><th>Status</th><th>Assigned to</th><th>Created</th></tr></thead>
        <tbody id="ticket-rows"></tbody>
      </table>
    </div>
  </section>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/tickets.js') }}"></script>{% endblock %}
